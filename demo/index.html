  <body>
    <main id="demo">
      <noscript>
        <h1>Rosette</h1>
        <p>
          An FFGL effect that prints the frame instead of texturing it: four
          plates at their own screen angles, laid down by a press that never
          quite registers them. Rosettes, moiré, dot gain and overprint are all
          what four lattices and some ink do, rather than effects drawn on top.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/rosette">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/rosette/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/rosette">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
